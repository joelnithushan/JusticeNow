name: CI

# Runs on every pull request into main and every push to main.
# A red check here means the PR cannot be merged cleanly — this is what makes
# the project rules automatic rather than advisory.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-unit:
    name: Lint + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root, server, client)
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root, server, client)
        run: npm run install:all

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e + accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
