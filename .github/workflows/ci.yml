name: CI

# Runs on every pull request into main and every push to main.
# A red check here means the PR cannot be merged cleanly — this is what makes
# the project rules automatic rather than advisory.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-unit:
    name: Lint + unit/integration tests
    runs-on: ubuntu-latest
    # Placeholder Supabase config so the client builds/tests without real
    # credentials. The client's supabaseClient throws at import if these are
    # missing; no real Supabase is contacted in CI, so dummy values are fine.
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root, server, client)
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Same placeholder Supabase config: `vite build` (run by the Playwright
    # webServer) inlines import.meta.env at build time, so these must be present
    # or the app throws on boot and every page test times out.
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root, server, client)
        run: npm run install:all

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e + accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
