name: CI

# Runs on every pull request into main and every push to main.
# A red check here means the PR cannot be merged cleanly — this is what makes
# the project rules automatic rather than advisory.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-unit:
    name: Lint + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root, server, client)
        run: npm run install:all

      - name: Lint
        run: npm run lint

      - name: Unit + integration tests
        run: npm test

  mobile-typecheck:
    name: Mobile typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # The mobile app has no unit suite yet; a strict TypeScript check is the
      # gate that keeps the Expo app building and catches SDK/version drift
      # (e.g. an expo-router bump that doesn't match the installed Expo SDK).
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      # Fails if any expo-* / react-native package drifts off the installed SDK,
      # which unit-less mobile CI would otherwise miss.
      - name: Expo dependency consistency
        working-directory: mobile
        run: npx expo install --check

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (root, server, client)
        run: npm run install:all

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e + accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
